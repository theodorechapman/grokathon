[project]
name = "staticre"
version = "0.1.0"
description = "Thin semantic static-analysis API over PyGhidra"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the version bundled with Ghidra 11.4.2 (pyghidra 3.x needs Ghidra >=12)
    "pyghidra==2.2.1",
]

[project.scripts]
staticre = "staticre.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staticre"]
