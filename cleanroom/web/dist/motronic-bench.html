<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motronic 1.7 — engine demo</title>
    <meta
      name="description"
      content="Live cutaway engine demo driven by the Motronic 1.7 clean-room controller."
    />
    <style>
      /*
 * Dyno-bay demo. Dark steel bay, warm exhaust accent, one hero: the cutaway.
 */

:root {
  --bay: #0a0c10;
  --steel: #151a22;
  --steel-2: #1e2530;
  --edge: #3a4555;
  --aluminum: #c8d0dc;
  --mute: #7a8799;
  --exhaust: #ff6a1a;
  --coolant: #5eead4;
  --danger: #ff4d4d;
  --sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 50% 20%, #161b24 0%, var(--bay) 70%),
    var(--bay);
  color: var(--aluminum);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

#app {
  min-height: 100vh;
  padding: clamp(12px, 2vw, 28px);
}

.failure {
  margin: 0 0 16px;
  padding: 12px 14px;
  border: 1px solid var(--danger);
  background: rgba(255, 77, 77, 0.1);
  color: #ffb4b4;
  font-family: var(--mono);
}

.engine-demo {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: calc(100vh - 40px);
}

.demo-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px 18px;
}

.demo-eyebrow {
  margin: 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--mute);
}

.demo-head h1 {
  margin: 0;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 650;
  letter-spacing: -0.03em;
  color: #eef2f7;
}

.demo-layout {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(200px, 240px) minmax(0, 1fr) minmax(140px, 180px);
  gap: 16px;
  min-height: 0;
}

@media (max-width: 900px) {
  .demo-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(320px, 1fr) auto;
  }

  .demo-gauges {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  }
}

.demo-controls {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  background: color-mix(in srgb, var(--steel) 92%, black);
  border: 1px solid var(--edge);
  border-radius: 12px;
}

.demo-power {
  appearance: none;
  border: 1px solid color-mix(in srgb, var(--coolant) 50%, var(--edge));
  background: linear-gradient(180deg, #1d2a2a, #12181c);
  color: var(--coolant);
  font: inherit;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 14px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.demo-power:hover { border-color: var(--coolant); }
.demo-power:focus-visible {
  outline: 2px solid var(--coolant);
  outline-offset: 2px;
}
.demo-power.is-running {
  border-color: color-mix(in srgb, var(--exhaust) 60%, var(--edge));
  color: #ffc4a0;
  background: linear-gradient(180deg, #2a1a14, #161210);
}

.demo-scenarios {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.demo-scenario {
  appearance: none;
  border: 1px solid var(--edge);
  background: var(--steel-2);
  color: var(--aluminum);
  font: inherit;
  font-size: 12px;
  text-transform: lowercase;
  padding: 10px 8px;
  border-radius: 8px;
  cursor: pointer;
}

.demo-scenario:hover { border-color: #5a6a7e; }
.demo-scenario:focus-visible {
  outline: 2px solid var(--coolant);
  outline-offset: 2px;
}
.demo-scenario.is-active {
  border-color: var(--exhaust);
  color: #ffe0cc;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--exhaust) 40%, transparent);
}

.demo-slider-row {
  display: grid;
  grid-template-columns: 64px 1fr 40px;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--mute);
}

.demo-slider-label {
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 10px;
}

.demo-slider {
  width: 100%;
  accent-color: var(--exhaust);
}

.demo-slider-value {
  font-family: var(--mono);
  text-align: right;
  color: var(--aluminum);
}

.demo-blurb {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--mute);
  line-height: 1.45;
}

.engine-stage {
  position: relative;
  min-height: min(62vh, 640px);
  height: 100%;
  border: 1px solid var(--edge);
  border-radius: 14px;
  overflow: hidden;
  background: #0c0f14;
  box-shadow:
    inset 0 0 80px rgba(0, 0, 0, 0.45),
    0 20px 50px rgba(0, 0, 0, 0.35);
}

.engine-canvas {
  display: block;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.cut-badge {
  position: absolute;
  top: 16px;
  right: 16px;
  padding: 8px 12px;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: #1a0505;
  background: var(--danger);
  box-shadow: 0 0 24px rgba(255, 77, 77, 0.55);
  animation: cut-pulse 0.35s ease-in-out infinite alternate;
}

@keyframes cut-pulse {
  from { transform: scale(1); }
  to { transform: scale(1.04); }
}

@media (prefers-reduced-motion: reduce) {
  .cut-badge { animation: none; }
}

.demo-gauges {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.gauge {
  padding: 12px 14px;
  background: color-mix(in srgb, var(--steel) 92%, black);
  border: 1px solid var(--edge);
  border-radius: 10px;
}

.gauge-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 4px;
}

.gauge-value {
  font-family: var(--mono);
  font-size: 1.35rem;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: #f2f5f8;
  font-variant-numeric: tabular-nums;
}

.engine-demo.is-cutting .gauge:first-child .gauge-value {
  color: var(--danger);
}

.engine-demo.is-cutting .engine-stage {
  box-shadow:
    inset 0 0 80px rgba(80, 0, 0, 0.25),
    0 0 0 1px color-mix(in srgb, var(--danger) 40%, transparent),
    0 20px 50px rgba(0, 0, 0, 0.35);
}

    </style>
  </head>
