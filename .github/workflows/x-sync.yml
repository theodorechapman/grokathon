name: x-sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger X sync
        env:
          X_SYNC_SECRET: ${{ secrets.X_SYNC_SECRET }}
        run: |
          curl -sS -f -X POST \
            -H "x-sync-secret: $X_SYNC_SECRET" \
            https://playgrokgames.vercel.app/api/x/sync
