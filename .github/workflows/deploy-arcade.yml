name: deploy-arcade
on:
  push:
    branches: [main]
    paths: ["arcade/**"]
concurrency:
  group: deploy-arcade
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel production
        working-directory: arcade
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx -y vercel@latest --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
