<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Breakout</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 480, H = 640;
canvas.width = W;
canvas.height = H;

function fitCanvas() {
  const scale = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
}
addEventListener("resize", fitCanvas);
fitCanvas();

const paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 40, speed: 7 };
const ball = { x: W / 2, y: H / 2, r: 7, vx: 4, vy: -5 };
const ROWS = 6, COLS = 10, BW = 44, BH = 18, TOP = 70;
const COLORS = ["#f87171", "#fb923c", "#fbbf24", "#4ade80", "#7dd3fc", "#c084fc"];
let bricks, lives, score, state;

function reset() {
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: c * (BW + 4) + 2, y: TOP + r * (BH + 4), row: r, alive: true });
  lives = 3;
  score = 0;
  state = "play";
  serve();
}

function serve() {
  ball.x = W / 2;
  ball.y = H / 2;
  ball.vx = Math.random() < 0.5 ? 4 : -4;
  ball.vy = -5;
}

const keys = {};
addEventListener("keydown", (e) => { keys[e.key] = true; if (state !== "play") reset(); });
addEventListener("keyup", (e) => { keys[e.key] = false; });
canvas.addEventListener("pointermove", (e) => {
  const rect = canvas.getBoundingClientRect();
  paddle.x = ((e.clientX - rect.left) / rect.width) * W - paddle.w / 2;
});
canvas.addEventListener("pointerdown", () => { if (state !== "play") reset(); });

function update() {
  if (state !== "play") return;
  if (keys.ArrowLeft) paddle.x -= paddle.speed;
  if (keys.ArrowRight) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  ball.x += ball.vx;
  ball.y += ball.vy;
  if (ball.x < ball.r || ball.x > W - ball.r) ball.vx *= -1;
  if (ball.y < ball.r) ball.vy *= -1;

  if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y < paddle.y + paddle.h &&
      ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
    ball.vy *= -1;
    ball.vx = ((ball.x - paddle.x) / paddle.w - 0.5) * 10;
  }

  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x > b.x && ball.x < b.x + BW && ball.y - ball.r < b.y + BH && ball.y + ball.r > b.y) {
      b.alive = false;
      ball.vy *= -1;
      score += 10;
      break;
    }
  }

  if (bricks.every((b) => !b.alive)) state = "won";
  if (ball.y > H + ball.r) {
    lives--;
    if (lives <= 0) state = "lost";
    else serve();
  }
}

function draw() {
  ctx.fillStyle = "#0a0a0f";
  ctx.fillRect(0, 0, W, H);
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = COLORS[b.row];
    ctx.fillRect(b.x, b.y, BW, BH);
  }
  ctx.fillStyle = "#e8e8f0";
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = "16px monospace";
  ctx.fillText("score " + score, 12, 28);
  ctx.fillText("lives " + lives, W - 90, 28);
  if (state !== "play") {
    ctx.textAlign = "center";
    ctx.font = "28px monospace";
    ctx.fillText(state === "won" ? "YOU WIN" : "GAME OVER", W / 2, H / 2 - 20);
    ctx.font = "16px monospace";
    ctx.fillText("tap or press any key", W / 2, H / 2 + 12);
    ctx.textAlign = "left";
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
